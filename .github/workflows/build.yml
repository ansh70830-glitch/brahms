name: Build desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install desktop dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-desktop.txt ]; then
            pip install -r requirements-desktop.txt
          else
            echo "ERROR: requirements-desktop.txt is missing"
            exit 1
          fi

      - name: Build app bundle
        shell: bash
        run: |
          if [ ! -f packaging/bhrams.spec ]; then
            echo "ERROR: packaging/bhrams.spec is missing"
            exit 1
          fi
          pyinstaller --noconfirm packaging/bhrams.spec

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install desktop dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements-desktop.txt") {
            pip install -r requirements-desktop.txt
          } else {
            throw "ERROR: requirements-desktop.txt is missing"
          }

      - name: Build app bundle
        shell: pwsh
        run: |
          if (-not (Test-Path "packaging/bhrams.spec")) {
            throw "ERROR: packaging/bhrams.spec is missing"
          }
          pyinstaller --noconfirm packaging/bhrams.spec

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
